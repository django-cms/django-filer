name: Publish django-finder to PyPI

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  check-finder:
    name: Check tag belongs to finder
    runs-on: ubuntu-latest
    outputs:
      on-finder: ${{ steps.branch.outputs.on-finder }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tagged commit is on finder
        id: branch
        run: |
          if git merge-base --is-ancestor HEAD origin/finder; then
            echo "on-finder=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-finder=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: tagged commit is not on finder."
          fi

  build-and-publish:
    name: Build and publish django-finder
    needs: check-finder
    if: needs.check-finder.outputs.on-finder == 'true'
    runs-on: ubuntu-latest
    environment:
      name: finder
      url: https://pypi.org/p/django-finder
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
