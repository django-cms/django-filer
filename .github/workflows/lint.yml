name: Lint

on: [push]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        # Keep the version in sync with the ruff-pre-commit rev in
        # .pre-commit-config.yaml so both report the same findings.
        run: pip install ruff==0.16.3
      - name: Run ruff
        # --output-format=github annotates the offending lines in the diff view
        run: ruff check --output-format=github
