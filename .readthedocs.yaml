# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Match the CI docs job and `make strict`: a warning means a broken cross-reference,
  # an orphaned page or malformed markup, and those should not reach the published docs.
  fail_on_warning: true

# The package itself is deliberately not installed. docs/conf.py reads the version
# straight out of finder/__init__.py through sys.path, and installing django-finder
# would pull in Django 5.2+, which conflicts with the Django pinned for the docs build.
python:
  install:
    - requirements: docs/requirements.txt
