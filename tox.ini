[tox]
envlist =
    ruff
    docs
    frontend
    py{310,311,312}-{dj42,dj51,dj52}-{swap,noswap}
    py{312,313,314}-{dj60,dj61,djmain}-{swap,noswap}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

skip_missing_interpreters=True

[testenv]
allowlist_externals =
    {env:COMMAND:coverage}
    {envpython}
deps =
    dj42: -r tests/requirements/django-4.2.txt
    dj51: -r tests/requirements/django-5.1.txt
    dj52: -r tests/requirements/django-5.2.txt
    dj60: -r tests/requirements/django-6.0.txt
    dj61: -r tests/requirements/django-6.1.txt
    djmain: -r tests/requirements/django-main.txt
commands =
    {envpython} --version
    {env:COMMAND:coverage} erase
    {env:COMMAND:coverage} run tests/settings.py
    {env:COMMAND:coverage} report
setenv =
    swap: CUSTOM_IMAGE=custom_image.Image

[testenv:ruff]
# Keep the version in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
deps = ruff==0.16.3
commands = ruff check
skip_install = true

[testenv:docs]
changedir = docs
deps =
    sphinx
    sphinx-autobuild
    sphinxcontrib-spelling
    sphinx-copybutton
    sphinxext-opengraph
    sphinxcontrib-images
    sphinxcontrib-inlinesyntaxhighlight
    furo
commands =
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
    # sphinx-build -W -b html -d build/doctrees . build/html
skip_install = true

[testenv:frontend]
allowlist_externals =
    nvm
    npm
    gulp
commands =
    gulp ci
