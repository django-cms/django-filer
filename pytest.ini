[pytest]
DJANGO_SETTINGS_MODULE = unittests.settings
django_find_project = false
addopts = --tb=native
# The browser tests in demoapp/e2etests need their own settings module and are
# therefore not collected by a bare `pytest` run. Start them with:
#   pytest demoapp/e2etests --ds=demoapp.e2etests.settings
testpaths = unittests
