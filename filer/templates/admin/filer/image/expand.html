{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en-us' }}">
    <head>
        <meta charset="utf-8">
        <title>{{ label }}</title>
        <style>
            img {
                cursor: zoom-out;
            }
            body.scrolling img {
                cursor: zoom-out;
            }
            body.scrolling img.zoom {
                cursor: zoom-in;
            }
            img.zoom {
                width: 100%;
                cursor: zoom-out;
            }
        </style>
    </head>
    <body style="margin: 0;">
        <img id="img" src="{{ original_url }}" alt="{{ label }}" tabindex="0" role="button" aria-pressed="false"
             title="{% translate 'Toggle zoom' %}"/>
        <script>
            const img = document.getElementById('img');
            const toggleZoom = function () {
                img.setAttribute('aria-pressed', img.classList.toggle('zoom') ? 'true' : 'false');
            };
            img.addEventListener('click', toggleZoom);
            img.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleZoom();
                }
            });
            setInterval(function () {
                document.body.classList.toggle('scrolling', img.naturalWidth >= document.body.clientWidth)
            }, 200);
        </script>
    </body>
</html>
