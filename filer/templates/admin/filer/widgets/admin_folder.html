{% load i18n filer_admin_tags static %}

{% spaceless %}
    <div class="filer-dropzone filer-dropzone-folder">
        <span class="filerFile">
            <a href="{{ lookup_url }}" class="related-lookup{% if object %} hidden{% endif %}" id="{{ lookup_name }}" title="{% trans 'Lookup' %}">
                <span class="fa fa-search cms-icon cms-icon-search" aria-hidden="true"></span>&nbsp;
                {% trans "Choose Folder" %}
            </a>
            <img src="{% static "filer/icons/folder.svg" %}" alt="" class="thumbnail_img{% if not object %} hidden{% endif %}"/>
            <span id="{{ span_id }}" style="margin-left: 15px;">
                <span class="description_text">
                    {% if object %}
                        {{ object.pretty_logical_path }}
                    {% endif %}
                </span>
            </span>
            <a class="filerClearer {% if not object %}hidden{% endif %}" id="{{ clear_id }}" title="{% translate 'Clear' %}" aria-label="{% translate 'Clear' %}" href="#" role="button">
                <span class="fa fa-close filer-icon filer-icon-remove-selection" aria-hidden="true"></span>
            </a>
            <div class="hidden">{{ hidden_input }}</div>
        </span>
    </div>
{% endspaceless %}
